openapi: 3.2.0
info:
  title: Qualtrics Directories API
  version: '0.2'
  description: 'Operations tagged Directories across 2 of this provider''s published API definitions: qualtrics-api-openapi-3.0.json, qualtrics-api-swagger-2.0.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{apiRegion}.qualtrics.com/API/{apiVersion}
  description: Qualtrics API endpoint for EU region
  variables:
    apiRegion:
      default: fra1
      description: Specify the Qualtrics datacenter prefix according to your account (find it at <your URL>/Q/QualtricsIdsSection/IdsSection)
    apiVersion:
      default: v3
      description: API version to use - default v3
- url: https://fra1.qualtrics.com/API/v3
tags:
- name: Directories
paths:
  /directories/{DirectoryId}/mailinglists/{MailingListId}/contacts:
    post:
      summary: Create a contact in a given mailing list
      operationId: Createcontactinmailinglist
      parameters:
      - $ref: '#/components/parameters/Content-Type'
      - $ref: '#/components/parameters/DirectoryId'
      - $ref: '#/components/parameters/MailingListId'
      responses:
        '200':
          description: ''
          headers: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/requestBodies/CreateContactInMailingList'
      tags:
      - Directories
      security:
      - QualtricsAPIKeyAuth: []
    servers:
    - url: https://{apiRegion}.qualtrics.com/API/{apiVersion}
      description: Qualtrics API endpoint for EU region
      variables:
        apiRegion:
          default: fra1
          description: Specify the Qualtrics datacenter prefix according to your account (find it at <your URL>/Q/QualtricsIdsSection/IdsSection)
        apiVersion:
          default: v3
          description: API version to use - default v3
components:
  parameters:
    MailingListId:
      name: MailingListId
      required: true
      in: path
      schema:
        type: string
    Content-Type:
      name: Content-Type
      in: header
      required: true
      style: simple
      schema:
        type: string
        example: application/json
    DirectoryId:
      name: DirectoryId
      required: true
      in: path
      schema:
        type: string
  requestBodies:
    CreateContactInMailingList:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              firstName:
                type: string
              lastName:
                type: string
              email:
                type: string
              unsubscribed:
                type: boolean
  schemas:
    CreateContactInMailingList:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        unsubscribed:
          type: boolean
  securitySchemes:
    QualtricsAPIKeyAuth:
      type: apiKey
      in: header
      name: X-API-TOKEN
    api_key:
      type: apiKey
      name: X-API-TOKEN
      in: header
x-refined-from:
- qualtrics-api-openapi-3.0.json
- qualtrics-api-swagger-2.0.json
